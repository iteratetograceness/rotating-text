name: Publish

# Publishes the package.json version to npm through npm Trusted Publishing (no
# npm token needed) and creates a GitHub release with the matching CHANGELOG.md
# section as its notes. Start it either by pushing a tag like v1.0.5, or with
# "Run workflow" on main, which creates the v<version> tag with the release.
# A manual run publishes the tip of main unless you give it an earlier commit.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Commit on main to publish (leave empty for the tip of main)
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11

      - name: Work out the version and tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "$TAG" ]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
              exit 1
            fi
          else
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "Run this workflow on main, not $GITHUB_REF_NAME"
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "$(git rev-parse HEAD) is not on main"
              exit 1
            fi
            if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
              echo "$TAG already exists. Bump the version in package.json first."
              exit 1
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # Installing runs `prepare`, which rebuilds dist. Under yarn the rebuild
      # is byte-for-byte what is committed, source maps included.
      - run: npx yarn@1 install --frozen-lockfile

      - name: Check the committed dist matches the build
        run: git diff --exit-code -- dist

      - run: npm test

      - name: Get the release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            /^## / { if (p) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { p = 1; next } }
            p
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "No CHANGELOG.md section for $VERSION"
            exit 1
          fi

      # Authenticates through Trusted Publishing (OIDC) and adds provenance.
      - run: npm publish

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Creates the tag at this commit if it does not exist yet.
        run: gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
